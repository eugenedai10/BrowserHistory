<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browsing Summary</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;  --surface: #fcfcfb;  --ink: #0b0b0b;  --ink2: #52514e;  --muted: #898781;
    --grid: #e1e0d9;  --axis: #c3c2b7;  --border: rgba(11,11,11,.10);  --wash: rgba(11,11,11,.05);
    --s1: #2a78d6;  --s2: #eb6834;  --s3: #1baf7a;  --track: #cde2fb;
    --c4: #eda100;  --c5: #e87ba4;  --c6: #008300;  --c-other: #898781;
    --good: #0ca30c;  --good-text: #006300;  --warning: #fab219;  --critical: #d03b3b;
    --shadow: 0 6px 24px rgba(0,0,0,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;  --surface: #1a1a19;  --ink: #f0efec;  --ink2: #c3c2b7;  --muted: #898781;
      --grid: #2c2c2a;  --axis: #383835;  --border: rgba(255,255,255,.10);  --wash: rgba(255,255,255,.06);
      --s1: #3987e5;  --s2: #d95926;  --s3: #199e70;  --track: #184f95;
      --c4: #c98500;  --c5: #d55181;  --c6: #008300;
      --good-text: #0ca30c;  --shadow: 0 6px 24px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;  --surface: #1a1a19;  --ink: #f0efec;  --ink2: #c3c2b7;  --muted: #898781;
    --grid: #2c2c2a;  --axis: #383835;  --border: rgba(255,255,255,.10);  --wash: rgba(255,255,255,.06);
    --s1: #3987e5;  --s2: #d95926;  --s3: #199e70;  --track: #184f95;
    --c4: #c98500;  --c5: #d55181;  --c6: #008300;
    --good-text: #0ca30c;  --shadow: 0 6px 24px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  html { background: var(--page); }
  body { margin: 0; background: var(--page); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input { font: inherit; color: inherit; }
  h1, h2, h3, p { margin: 0; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 0 16px 48px; }

  /* ---------- header + date navigation ---------- */
  .top { position: sticky; top: 0; z-index: 20; background: var(--page); border-bottom: 1px solid var(--border); }
  .top .wrap { padding-bottom: 0; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 0 6px; flex-wrap: wrap; }
  .bar h1 { font-size: 17px; font-weight: 650; margin-right: auto; }
  .nav { display: flex; align-items: center; gap: 8px; padding: 6px 0 12px; flex-wrap: wrap; }
  .btn { height: 32px; min-width: 32px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px;
         background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn:hover:not(:disabled) { background: var(--wash); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:focus-visible, .seg button:focus-visible, .tab:focus-visible, .link:focus-visible, input:focus-visible, summary:focus-visible
      { outline: 2px solid var(--s1); outline-offset: 2px; }
  input[type=date] { height: 32px; padding: 0 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .daylabel { font-weight: 600; margin-left: 4px; }
  .pos { color: var(--ink2); font-size: 12px; }
  .spacer { flex: 1; }
  .pill { height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface);
          cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
  .pill .g { font-weight: 700; }
  .pill.ok .g { color: var(--good-text); }
  .pill.warn .g { color: #b87800; }
  .pill.bad .g { color: var(--critical); }
  .pill.unk .g { color: var(--muted); }

  /* ---------- cards ---------- */
  main { padding-top: 16px; transition: opacity .15s; }
  main.loading { opacity: .5; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; min-width: 0; }
  .card-h { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .card-h > div:first-child { margin-right: auto; }
  .card h2 { font-size: 14px; font-weight: 650; }
  .sub { color: var(--ink2); font-size: 12px; margin-top: 2px; }
  .card-tools { display: flex; gap: 8px; align-items: center; }
  .link { background: none; border: 0; padding: 4px 6px; border-radius: 6px; color: var(--ink2); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .link:hover { color: var(--ink); }
  .grid2 { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; }
  .grid2 > .card { margin-bottom: 0; }
  .grid2 { margin-bottom: 16px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }

  /* segmented control (metric picker) */
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { height: 28px; padding: 0 10px; background: var(--surface); border: 0; cursor: pointer; font-size: 12px; color: var(--ink2); }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed=true] { background: var(--wash); color: var(--ink); font-weight: 600; }

  /* ---------- stat tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; min-width: 0; }
  .tile .l { color: var(--ink2); font-size: 12px; }
  .tile .v { font-size: 26px; font-weight: 650; line-height: 1.2; margin-top: 2px; }
  .tile .s { color: var(--ink2); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }

  /* ---------- svg charts ---------- */
  .chart-body { min-height: 60px; width: 100%; }
  svg { display: block; max-width: 100%; overflow: visible; }
  svg text { font-family: inherit; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .axisline { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--muted); font-size: 11px; }
  .tick.sel { fill: var(--ink); font-weight: 600; }
  .vlabel { fill: var(--ink); font-size: 11px; font-weight: 600; }
  .hit { fill: transparent; }
  .col { cursor: pointer; outline: none; }
  .col.static { cursor: default; }
  .col:hover .hit, .col:focus-visible .hit { fill: var(--wash); }
  .col .seg-bar { transition: opacity .1s; }
  .col.dim .seg-bar { opacity: .5; }
  .col.dim:hover .seg-bar, .col.dim:focus-visible .seg-bar { opacity: .85; }

  .legend { display: flex; gap: 14px; margin: 0 0 8px; font-size: 12px; color: var(--ink2); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  /* ---------- horizontal bar lists ---------- */
  .bars { display: grid; gap: 6px; }
  .brow { display: grid; grid-template-columns: minmax(80px, 38%) 1fr; gap: 10px; align-items: center; }
  .brow .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brow .name small { display: block; color: var(--ink2); font-size: 11px; }
  .btrack { display: flex; align-items: center; min-width: 0; }
  .bfill { height: 10px; border-radius: 0 4px 4px 0; background: var(--accent, var(--s1)); flex: none; min-width: 2px; }
  .bval { margin-left: 8px; color: var(--ink); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .empty { color: var(--ink2); padding: 8px 0; }

  /* ---------- youtube ---------- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  .tab { background: none; border: 0; padding: 8px 12px; cursor: pointer; color: var(--ink2); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 6px; }
  .tab i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .tab[aria-selected=true] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  .ytstats { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 16px; }
  .ytstats .l { color: var(--ink2); font-size: 12px; }
  .ytstats .v { font-size: 20px; font-weight: 650; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 16px; }
  @media (max-width: 720px) { .cols { grid-template-columns: 1fr; gap: 16px; } }
  h3 { font-size: 12px; font-weight: 600; color: var(--ink2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .04em; }
  .sess { border-top: 1px solid var(--grid); padding: 8px 0; display: grid; grid-template-columns: 112px 1fr auto; gap: 12px; align-items: start; }
  .sess .time { color: var(--ink2); font-size: 12px; font-variant-numeric: tabular-nums; }
  .sess .t { overflow-wrap: anywhere; }
  .sess .m { color: var(--ink2); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
  .sess .w { text-align: right; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .prog { height: 4px; border-radius: 2px; background: var(--grid); margin-top: 5px; width: 90px; margin-left: auto; overflow: hidden; }
  .prog b { display: block; height: 100%; background: var(--accent, var(--s1)); }
  @media (max-width: 560px) { .sess { grid-template-columns: 1fr auto; } .sess .time { grid-column: 1 / -1; } }
  .morebtn { margin-top: 10px; }

  /* ---------- tables ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--ink2); font-weight: 600; font-size: 12px; border-top: 0; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .tablewrap { overflow-x: auto; max-height: 340px; overflow-y: auto; }

  /* ---------- logging health ---------- */
  .cov { position: relative; height: 18px; border-radius: 6px; background: var(--s1); margin: 6px 0 4px; overflow: hidden; }
  .cov .gap { position: absolute; top: 0; bottom: 0; min-width: 3px; cursor: default; outline: none; }
  .cov .gap.warn { background: var(--warning); }
  .cov .gap.bad { background: var(--critical); }
  .cov .gap:hover, .cov .gap:focus-visible { filter: brightness(1.15); box-shadow: inset 0 0 0 2px var(--surface); }
  .covticks { position: relative; height: 16px; color: var(--muted); font-size: 11px; margin-bottom: 8px; }
  .covticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .covticks span:first-child { transform: none; }
  .covticks span:last-child { transform: translateX(-100%); }
  .cov.apps { background: var(--wash); }
  .cov.apps .aseg { position: absolute; top: 0; bottom: 0; min-width: 3px; border-right: 1px solid var(--surface); cursor: default; outline: none; }
  .cov.apps .aseg:hover, .cov.apps .aseg:focus-visible { filter: brightness(1.15); box-shadow: inset 0 0 0 2px var(--surface); }
  .legend .lg { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tlhead { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-top: 12px; }
  .tlhead .note { margin: 0; }
  .tlslide { margin: 8px 0 4px; }
  .tlslide[hidden] { display: none; }
  .tlslide input { width: 100%; accent-color: var(--s1); }
  .away-fill { background: repeating-linear-gradient(135deg, var(--axis) 0 3px, transparent 3px 6px); }
  .sev { white-space: nowrap; font-weight: 600; }
  .sev.warn { color: #8a5d00; } .sev.bad { color: var(--critical); }
  @media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) .sev.warn { color: var(--warning); } }
  :root[data-theme="dark"] .sev.warn { color: var(--warning); }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--ink2); }
  pre { margin: 8px 0 0; padding: 12px; background: var(--page); border: 1px solid var(--border); border-radius: 8px;
        overflow-x: auto; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
  .note { color: var(--ink2); font-size: 13px; margin: 6px 0; }
  .err { border-color: var(--critical); }

  /* ---------- tooltip ---------- */
  #tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
         border-radius: 8px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 12px; max-width: 280px; }
  #tip[hidden] { display: none; }
  #tip .tt { color: var(--ink2); margin-bottom: 4px; }
  #tip .tr { display: flex; align-items: center; gap: 8px; }
  #tip .key { width: 10px; height: 3px; border-radius: 2px; flex: none; }
  #tip .tv { font-weight: 650; font-size: 13px; font-variant-numeric: tabular-nums; }
  #tip .tl { color: var(--ink2); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <h1>Browsing summary</h1>
      <button class="pill unk" id="integrity" title="Checking log integrity…"><span class="g">…</span><span class="t">Checking log</span></button>
      <button class="btn" id="theme" title="Theme: auto" aria-label="Toggle theme">Auto</button>
    </div>
    <div class="nav">
      <button class="btn" id="prev" aria-label="Previous day">&larr;</button>
      <input type="date" id="date" aria-label="Pick a date">
      <button class="btn" id="next" aria-label="Next day">&rarr;</button>
      <button class="btn" id="today">Today</button>
      <button class="btn" id="latest" title="Most recent day with a log">Latest</button>
      <span class="daylabel" id="daylabel"></span>
      <span class="pos" id="pos"></span>
      <span class="spacer"></span>
      <button class="btn" id="refresh" title="Reload" aria-label="Reload">&#8635;</button>
    </div>
  </div>
</header>
<div class="wrap"><main id="app" aria-live="polite"></main></div>
<div id="tip" role="status" hidden></div>

<script>
'use strict';
// ---------- tiny DOM helpers (all log data goes in via textContent: titles and queries are untrusted) ----------
const SVGNS = 'http://www.w3.org/2000/svg';
function mk(el, props, kids) {
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.setAttribute('class', v);
    else if (k === 'on') for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
    else if (k === 'style') el.style.cssText = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const h = (tag, props, ...kids) => mk(document.createElement(tag), props, kids);
const sv = (tag, props, ...kids) => mk(document.createElementNS(SVGNS, tag), props, kids);
const $ = (s) => document.querySelector(s);

// ---------- formatting ----------
function fmt(sec) {  // same style as tools/summary.py
  sec = Math.floor(sec || 0);
  const hh = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return hh ? `${hh}h${String(m).padStart(2, '0')}m` : (m ? `${m}m${String(s).padStart(2, '0')}s` : `${s}s`);
}
function fmtShort(sec) {
  sec = Math.round(sec || 0);
  const hh = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  if (hh) return m ? `${hh}h ${m}m` : `${hh}h`;
  if (m) return `${m}m`;
  return `${sec}s`;
}
const pad2 = (n) => String(n).padStart(2, '0');
const toLocalDate = (day) => { const [y, m, d] = day.split('-').map(Number); return new Date(y, m - 1, d); };
const dayStr = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayStr = () => dayStr(new Date());
const clock = (iso) => { const d = new Date(iso); return isNaN(d) ? '?' : `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; };
const hm = (iso) => clock(iso).slice(0, 5);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

// ---------- state ----------
const st = { days: [], trend: [], day: null, res: null, integrity: null, metric: 'active', ytTab: 'video', expand: {}, seq: 0, logDir: '' };
const app = $('#app');

async function api(path) {
  const r = await fetch(path, { cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// ---------- tooltip (hover and keyboard focus show the same thing) ----------
const tip = $('#tip');
function tipNode(title, rows) {
  return h('div', null,
    title && h('div', { class: 'tt' }, title),
    rows.map((r) => h('div', { class: 'tr' },
      r.color && h('span', { class: 'key', style: `background:${r.color}` }),
      h('span', { class: 'tv' }, r.value), r.label && h('span', { class: 'tl' }, r.label))));
}
function placeTip(x, y) {
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(x + 14, innerWidth - r.width - 8)) + 'px';
  tip.style.top = Math.max(8, Math.min(y + 14, innerHeight - r.height - 8)) + 'px';
}
function attachTip(el, build) {
  const show = (x, y) => { tip.replaceChildren(build()); tip.hidden = false; placeTip(x, y); };
  el.addEventListener('pointermove', (e) => show(e.clientX, e.clientY));
  el.addEventListener('pointerleave', () => { tip.hidden = true; });
  el.addEventListener('focus', () => { const b = el.getBoundingClientRect(); show(b.left + b.width / 2, b.top); });
  el.addEventListener('blur', () => { tip.hidden = true; });
}

// ---------- chart card: chart <-> table toggle, redraws on resize ----------
function chartCard({ title, sub, legend, tools, build, table, extraClass }) {
  const body = h('div', { class: 'chart-body' });
  let showTable = false, lastW = 0;
  const btn = h('button', { class: 'link', 'aria-pressed': 'false', on: { click() {
    showTable = !showTable; btn.setAttribute('aria-pressed', String(showTable)); btn.textContent = showTable ? 'Chart' : 'Table'; draw();
  } } }, 'Table');
  const legendBox = h('div');
  function draw() {
    if (showTable) { body.replaceChildren(table()); legendBox.replaceChildren(); return; }
    const w = Math.floor(body.clientWidth);
    if (w < 40) return;
    lastW = w;
    legendBox.replaceChildren(legend ? legend() : '');
    body.replaceChildren(build(w));
  }
  new ResizeObserver(() => { if (!showTable && Math.floor(body.clientWidth) !== lastW) draw(); }).observe(body);
  const el = h('section', { class: 'card ' + (extraClass || '') },
    h('div', { class: 'card-h' }, h('div', null, h('h2', null, title), sub && h('p', { class: 'sub' }, sub)),
      h('div', { class: 'card-tools' }, tools, btn)),
    legendBox, body);
  return { el, redraw: draw };
}

function niceTicks(max, n = 4) {
  if (!(max > 0)) return { max: 1, ticks: [0, 1] };
  const raw = max / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
  const top = Math.ceil(max / step - 1e-9) * step, ticks = [];
  for (let v = 0; v <= top + 1e-9; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
  return { max: top, ticks };
}
function roundTop(x, y, w, hgt, r) {  // 4px rounded data-end, square at the baseline
  const rr = Math.min(r, w / 2, hgt);
  return `M${x},${y + hgt}V${y + rr}Q${x},${y} ${x + rr},${y}H${x + w - rr}Q${x + w},${y} ${x + w},${y + rr}V${y + hgt}Z`;
}

// One column chart used by the trend strip and the hourly chart. items: [{key, label, vals[], aria}]
function columns({ w, ht = 200, items, colors, kind, selectedKey, onSelect, tipFn, labelMinPx = 46 }) {
  const m = { l: 44, r: 6, t: 20, b: 26 }, pw = w - m.l - m.r, ph = ht - m.t - m.b;
  const totals = items.map((it) => it.vals.reduce((a, b) => a + b, 0));
  const rawMax = Math.max(0, ...totals);
  let div = 1, suf = '';
  if (kind === 'time') { if (rawMax >= 7200) { div = 3600; suf = 'h'; } else if (rawMax >= 120) { div = 60; suf = 'm'; } else { suf = 's'; } }
  const nt = niceTicks(rawMax / div), ymax = nt.max * div;
  const y = (v) => m.t + ph - (v / ymax) * ph;
  const slot = pw / items.length, bw = Math.min(24, Math.max(3, slot - 2));
  const svg = sv('svg', { width: w, height: ht, viewBox: `0 0 ${w} ${ht}` });
  for (const t of nt.ticks) {
    const yy = Math.round(y(t * div)) + .5;
    svg.append(sv('line', { class: t === 0 ? 'axisline' : 'gridline', x1: m.l, x2: w - m.r, y1: yy, y2: yy }));
    svg.append(sv('text', { class: 'tick', x: m.l - 8, y: yy + 4, 'text-anchor': 'end' }, `${t}${suf}`));
  }
  const step = Math.max(1, Math.ceil(labelMinPx / slot));
  items.forEach((it, i) => {
    const x0 = m.l + i * slot, bx = x0 + (slot - bw) / 2;
    const sel = selectedKey != null && it.key === selectedKey, dim = selectedKey != null && !sel;
    const g = sv('g', { class: 'col' + (dim ? ' dim' : '') + (onSelect ? '' : ' static'), tabindex: 0, role: onSelect ? 'button' : 'img', 'aria-label': it.aria || it.label });
    g.append(sv('rect', { class: 'hit', x: x0, y: m.t - 4, width: slot, height: ph + 4, rx: 4 }));
    const pos = it.vals.map((v, j) => [v, j]).filter(([v]) => v > 0);
    let cum = 0;
    pos.forEach(([v, j], k) => {
      const top = y(cum + v), bottom = y(cum) - (k > 0 ? 2 : 0), hgt = Math.max(2, bottom - top);
      const p = k === pos.length - 1
        ? sv('path', { class: 'seg-bar', d: roundTop(bx, bottom - hgt, bw, hgt, 4) })
        : sv('rect', { class: 'seg-bar', x: bx, y: bottom - hgt, width: bw, height: hgt });
      p.style.fill = colors[j];
      g.append(p);
      cum += v;
    });
    if (sel && totals[i] > 0) {
      g.append(sv('text', { class: 'vlabel', x: x0 + slot / 2, y: y(totals[i]) - 6, 'text-anchor': 'middle' },
        kind === 'time' ? fmtShort(totals[i]) : String(totals[i])));
    }
    if (i % step === 0 || sel) g.append(sv('text', { class: 'tick' + (sel ? ' sel' : ''), x: x0 + slot / 2, y: ht - 8, 'text-anchor': 'middle' }, it.label));
    if (onSelect) {
      g.addEventListener('click', () => onSelect(it));
      g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onSelect(it); } });
    }
    attachTip(g, () => tipFn(it));
    svg.append(g);
  });
  return svg;
}

// ---------- range-adjustable timelines (applications, YouTube) ----------
// The same bar as the logging-health coverage bar, one segment per item. The range is adjustable: Fit (first to last
// item), a 1/3/6/12 h window you slide along the day, or the full day. Overlapping items get their own lane.
// items: [{from, to (ISO), color (CSS), stripe?, aria, tip: [{color?, value, label?}]}]; state: {win, start} (kept
// across day changes and refreshes; start = minutes after local midnight).
const TL_WINDOWS = [['fit', 'Fit'], [60, '1 h'], [180, '3 h'], [360, '6 h'], [720, '12 h'], ['day', 'Day']];
const tlApps = { win: 'fit', start: null };
const tlYt = { win: 'fit', start: null };
const TL_LANE_PX = 18;

function rangeTimeline({ day, items, state, noun, legend }) {
  if (!items.length) return null;
  const [y, mo, dd] = day.split('-').map(Number);
  const midnight = new Date(y, mo - 1, dd).getTime(), nextMidnight = new Date(y, mo - 1, dd + 1).getTime();
  const dayMin = Math.round((nextMidnight - midnight) / 60000);   // 1440, except on DST days
  const ms = items.map((it) => [Date.parse(it.from), Date.parse(it.to)]);
  const first = Math.min(...ms.map((m) => m[0])), last = Math.max(...ms.map((m) => m[1]));
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const winMin = () => (state.win === 'day' ? dayMin : Math.min(state.win, dayMin));
  // default for a new window: the most recent hours (ends at the last item, rounded up to :00/:30)
  const defaultStart = (w) => clamp(Math.ceil((last - midnight) / 1800000) * 30 - w, 0, dayMin - w);
  const range = () => {   // [from ms, to ms] shown on the axis
    if (state.win === 'fit') return [first, Math.max(last, first + 1)];
    if (state.win === 'day') return [midnight, nextMidnight];
    const w = winMin();
    state.start = clamp(state.start == null ? defaultStart(w) : state.start, 0, dayMin - w);
    return [midnight + state.start * 60000, midnight + (state.start + w) * 60000];
  };
  const tick = (t) => (t >= nextMidnight ? '24:00' : hm(new Date(t).toISOString()));
  // lanes: items sorted by start; each goes in the first lane that is free by then (apps never overlap: one lane)
  const lane = new Array(items.length).fill(0), laneEnd = [];
  items.map((_, i) => i).sort((i, j) => ms[i][0] - ms[j][0]).forEach((i) => {
    let l = laneEnd.findIndex((e) => e <= ms[i][0]);
    if (l < 0) { l = laneEnd.length; laneEnd.push(0); }
    laneEnd[l] = Math.max(ms[i][1], ms[i][0] + 1000); lane[i] = l;
  });
  const lanes = Math.max(1, laneEnd.length);

  const cov = h('div', { class: 'cov apps', role: 'img', style: `height:${lanes * (TL_LANE_PX + 2) - 2}px` });
  const ticks = h('div', { class: 'covticks' });
  const label = h('p', { class: 'note' });
  const slider = h('input', { type: 'range', min: 0, step: 5, 'aria-label': 'Start of the timeline window',
    on: { input() { state.start = Number(this.value); draw(); } } });
  const sliderRow = h('div', { class: 'tlslide' }, slider);
  const btns = h('div', { class: 'seg', role: 'group', 'aria-label': 'Timeline range' });
  TL_WINDOWS.forEach(([k, name]) => btns.append(h('button', { 'data-k': String(k), on: { click() {
    state.win = k; state.start = null; draw();
  } } }, name)));

  function draw() {
    const [r0, r1] = range(), total = r1 - r0;
    [...btns.children].forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.k === String(state.win))));
    const sliding = state.win !== 'fit' && state.win !== 'day';
    sliderRow.hidden = !sliding;
    if (sliding) { slider.max = dayMin - winMin(); slider.value = state.start; }
    const shown = items.map((_, i) => i).filter((i) => ms[i][1] > r0 && ms[i][0] < r1);
    cov.replaceChildren();
    cov.setAttribute('aria-label', `${noun} timeline ${tick(r0)} to ${tick(r1)}, ${plural(shown.length, 'item')}`);
    shown.forEach((i) => {
      const it = items[i], [f, e] = ms[i], l = Math.max(f, r0), rr = Math.min(e, r1);
      const seg = h('div', { class: 'aseg' + (it.stripe ? ' away-fill' : ''), tabindex: 0,
        style: `left:${((l - r0) / total) * 100}%;width:${((rr - l) / total) * 100}%;top:${lane[i] * (TL_LANE_PX + 2)}px;height:${TL_LANE_PX}px;bottom:auto`
          + (it.stripe ? '' : `;background:${it.color}`),
        'aria-label': it.aria });
      attachTip(seg, () => tipNode(`${clock(it.from)} → ${clock(it.to)}`, it.tip));
      cov.append(seg);
    });
    ticks.replaceChildren();
    for (let i = 0; i <= 4; i++) ticks.append(h('span', { style: `left:${i * 25}%` }, tick(r0 + (total * i) / 4)));
    label.replaceChildren(h('b', null, 'Timeline'), ` ${tick(r0)} – ${tick(r1)}`,
      shown.length ? '' : ' · nothing logged in this window');
  }
  draw();
  return h('div', { class: 'tlwrap' }, h('div', { class: 'tlhead' }, label, btns), sliderRow, legend, cov, ticks);
}

const TL_SLOTS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--c4)', 'var(--c5)', 'var(--c6)'];
const legendItem = (c, text) => h('span', { class: 'lg' }, h('i', { style: `background:${c}` }), text);

// Which app was in front when: the top 6 apps (by time) each get a fixed colour, the rest share "Other";
// away is striped; blank = not seen (asleep / monitor off).
function appTimeline(a, day) {
  const spans = a.spans || [];
  const color = new Map(a.list.slice(0, TL_SLOTS.length).map((r, i) => [r.bundle, TL_SLOTS[i]]));
  const away = (sp) => sp.app === null;
  const items = spans.map((sp) => {
    const secs = (Date.parse(sp.to) - Date.parse(sp.from)) / 1000;
    const c = away(sp) ? 'var(--muted)' : color.get(sp.bundle) || 'var(--c-other)';
    const what = away(sp) ? (sp.reason === 'locked' ? 'Away (screen locked)' : 'Away (no input for 5 min)') : sp.app;
    return { from: sp.from, to: sp.to, color: c, stripe: away(sp), aria: `${hm(sp.from)} to ${hm(sp.to)}, ${fmt(secs)}: ${what}`,
      tip: [{ color: c, value: fmt(secs), label: what }] };
  });
  const legend = h('div', { class: 'legend' },
    [...color].map(([bundle, c]) => legendItem(c, a.list.find((r) => r.bundle === bundle).app)),
    spans.some((sp) => !away(sp) && !color.has(sp.bundle)) && legendItem('var(--c-other)', 'Other apps'),
    spans.some(away) && h('span', { class: 'lg' }, h('i', { class: 'away-fill', style: 'outline:1px solid var(--axis)' }), 'Away (idle / locked)'),
    h('span', { class: 'lg' }, h('i', { style: 'background:var(--wash);outline:1px solid var(--axis)' }), 'Not seen (asleep / monitor off)'));
  return rangeTimeline({ day, items, state: tlApps, noun: 'Application', legend });
}

// When each video / Short / embed was watched: one segment per session (first to last event), coloured by channel
// (top 6 channels by watch time, the rest "Other channels"). Sessions that overlap in time get separate lanes.
function ytTimeline(y, day) {
  const color = new Map(y.channels.slice(0, TL_SLOTS.length).map((c, i) => [c.name, TL_SLOTS[i]]));
  const items = y.sessions.map((s) => {
    const c = color.get(s.channel) || 'var(--c-other)';
    const extra = [s.host ? 'on ' + s.host : s.source, s.finished && 'finished', s.partial && 'tab closed mid-video'].filter(Boolean).join(' · ');
    return { from: s.start, to: s.end, color: c,
      aria: `${hm(s.start)} to ${hm(s.end)}, ${fmt(s.watched_s)} watched: ${s.title || '(no title)'} (${s.channel})`,
      tip: [{ color: c, value: s.title || '(no title)' }, { value: `${fmt(s.watched_s)} watched`, label: `${s.channel} · ${extra}` }] };
  });
  const legend = h('div', { class: 'legend' },
    [...color].map(([name, c]) => legendItem(c, name)),
    y.sessions.some((s) => !color.has(s.channel)) && legendItem('var(--c-other)', 'Other channels'),
    h('span', { class: 'lg' }, h('i', { style: 'background:var(--wash);outline:1px solid var(--axis)' }), 'Not watching'));
  return rangeTimeline({ day, items, state: tlYt, noun: 'YouTube', legend });
}

function appsCard(d) {
  const a = d.apps;
  if (!a || (!a.list.length && !a.away_s)) return null;  // days before app tracking, or tracking off
  const rows = a.list.slice(0, 12).map((r) => ({
    name: r.app, sub: a.total_s ? `${Math.round((100 * r.s) / a.total_s)}%` : '', v: r.s,
    title: `${r.app} (${r.bundle}): ${fmt(r.s)} in front`,
  }));
  return h('section', { class: 'card' },
    h('div', { class: 'card-h' }, h('div', null, h('h2', null, 'Applications'),
      h('p', { class: 'sub' }, 'Time each app was in front (app names only; no window titles)'))),
    barList(rows, { fmtVal: fmtShort, empty: 'No application time logged' }),
    appTimeline(a, st.day),
    h('p', { class: 'note' }, h('b', null, fmtShort(a.total_s)), ' in use · ', h('b', null, fmtShort(a.away_s)),
      ' away (no input for 5 min, screen locked)'));

function sessionsList(rows, key, accent) {
  const limit = st.expand[key] ? rows.length : 12;
  const list = rows.slice(0, limit).map((s) => {
    const pct = s.length_s ? Math.min(100, (s.watched_s / s.length_s) * 100) : 0;
    const notes = [s.host ? 'on ' + s.host : s.source, s.finished && 'finished', s.loops && plural(s.loops, 'loop'), s.partial && 'tab closed mid-video'].filter(Boolean).join(' · ');
    return h('div', { class: 'sess' },
      h('div', { class: 'time' }, `${clock(s.start)} → ${clock(s.end)}`),
      h('div', null, h('div', { class: 't' }, s.title || '(no title)'), h('div', { class: 'm' }, `${s.channel} · ${notes}`)),
      h('div', { class: 'w' }, `${fmt(s.watched_s)}${s.length_s ? ' of ' + fmt(s.length_s) : ''}`,
        s.length_s ? h('div', { class: 'prog', style: `--accent:${accent}` }, h('b', { style: `width:${pct}%` })) : null));
  });
  const box = h('div', null, list);
  if (rows.length > 12) {
    box.append(h('button', { class: 'link morebtn', on: { click() { st.expand[key] = !st.expand[key]; render(); } } },
      st.expand[key] ? 'Show fewer' : `Show all ${rows.length}`));
  }
  return box;
}

function hostRows(sessions) {  // watch time per site hosting the embeds
  const by = {};
  for (const x of sessions) by[x.host || '?'] = (by[x.host || '?'] || 0) + x.watched_s;
  return Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([name, v]) => ({ name, v }));
}

function youtubeCard(d) {
  const kinds = [['video', 'Videos', '--s1'], ['short', 'Shorts', '--s2'], ['embed', 'Embedded', '--s3']];
  const total = d.youtube.video.count + d.youtube.short.count + d.youtube.embed.count;
  const card = h('section', { class: 'card' }, h('div', { class: 'card-h' }, h('div', null, h('h2', null, 'YouTube'), h('p', { class: 'sub' }, 'Watch time excludes ads and paused time. Embedded players (on other sites) count only while audible.'))));
  if (!total) { card.append(h('p', { class: 'empty' }, 'No YouTube watched on this day.')); return card; }
  const tabs = h('div', { class: 'tabs', role: 'tablist' });
  const panel = h('div', { role: 'tabpanel' });
  const paint = () => {
    const [kind, , cv] = kinds.find((k) => k[0] === st.ytTab);
    const y = d.youtube[kind], accent = cssVar(cv);
    [...tabs.children].forEach((b, i) => b.setAttribute('aria-selected', String(kinds[i][0] === st.ytTab)));
    // native replaceChildren() does not flatten arrays or skip null (it would print "[object ...]" / "null")
    panel.replaceChildren(...[
      h('div', { class: 'ytstats' },
        h('div', null, h('div', { class: 'l' }, 'Watched'), h('div', { class: 'v' }, fmtShort(y.watched_s))),
        h('div', null, h('div', { class: 'l' }, { video: 'Videos', short: 'Shorts', embed: 'Embedded videos' }[kind]), h('div', { class: 'v' }, y.count)),
        h('div', null, h('div', { class: 'l' }, 'Finished'), h('div', { class: 'v' }, y.finished)),
        kind === 'short' && h('div', null, h('div', { class: 'l' }, 'Loops'), h('div', { class: 'v' }, y.loops))),
      y.count ? ytTimeline(y, st.day) : null,
      y.count ? h('div', { class: 'cols', style: kind === 'embed' ? '' : 'grid-template-columns:1fr' },
        kind === 'embed' && h('div', null, h('h3', null, 'Embedded on'), barList(hostRows(y.sessions), { fmtVal: fmtShort, accent })),
        h('div', null, h('h3', null, 'Top channels'), barList(y.channels.slice(0, 6).map((c) => ({ name: c.name, v: c.s })), { fmtVal: fmtShort, accent })))
        : h('p', { class: 'empty' }, 'None on this day.'),
      y.count ? [h('h3', null, 'Everything watched, by watch time'),
        sessionsList([...y.sessions].sort((a, b) => b.watched_s - a.watched_s), 'yt-' + kind, accent)] : null,
    ].flat().filter(Boolean));
  };
  kinds.forEach(([k, label, cv]) => tabs.append(h('button', { class: 'tab', role: 'tab', on: { click() { st.ytTab = k; paint(); } } },
    h('i', { style: `background:var(${cv})` }), `${label} (${d.youtube[k].count})`)));
  card.append(tabs, panel);
  paint();
  return card;
}

function searchesCard(d) {
  if (!d.searches.length) return null;
  const limit = st.expand.search ? d.searches.length : 15;
  const card = h('section', { class: 'card' }, h('div', { class: 'card-h' }, h('div', null, h('h2', null, 'Searches'), h('p', { class: 'sub' }, plural(d.searches.length, 'search')))),
    h('div', { class: 'tablewrap' }, h('table', null, h('tbody', null, d.searches.slice(0, limit).map((s) => h('tr', null, h('td', null, s.engine || '?'), h('td', null, s.query || '')))))));
  if (d.searches.length > 15) card.append(h('button', { class: 'link morebtn', on: { click() { st.expand.search = !st.expand.search; render(); } } }, st.expand.search ? 'Show fewer' : `Show all ${d.searches.length}`));
  return card;
}

function healthCard(hl) {
  const card = h('section', { class: 'card' });
  const integ = st.integrity;
  card.append(h('div', { class: 'card-h' }, h('div', null, h('h2', null, 'Logging health'),
    h('p', { class: 'sub' }, 'Was the logger running? Silences longer than 1 min are listed with their cause.'))));
  if (integ) card.append(h('p', { class: 'note' }, h('b', null, 'Log integrity: '), integ.status));
  if (!hl.markers) {
    card.append(h('p', { class: 'note' }, 'No heartbeat markers in this log (written before gap tracking), so coverage cannot be judged.'));
  } else {
    const t0 = Date.parse(hl.first), t1 = Date.parse(hl.last), total = Math.max(1, t1 - t0);
    const logged = hl.span_s - hl.lost_s;
    card.append(h('p', { class: 'note' }, h('b', null, `${fmtShort(logged)} logged`), ` of ${fmtShort(hl.span_s)} between ${hm(hl.first)} and ${hm(hl.last)} (${Math.round((logged / Math.max(1, hl.span_s)) * 100)}%)`));
    const sev = (g) => (g.label.startsWith('UNEXPECTED') ? 'bad' : 'warn');
    const cov = h('div', { class: 'cov', role: 'img', 'aria-label': `Logging coverage with ${plural(hl.gaps.length, 'gap')}` });
    hl.gaps.forEach((g) => {
      const l = ((Date.parse(g.from) - t0) / total) * 100, wd = ((Date.parse(g.to) - Date.parse(g.from)) / total) * 100;
      const seg = h('div', { class: 'gap ' + sev(g), tabindex: 0, style: `left:${l}%;width:${wd}%`, 'aria-label': `${hm(g.from)} to ${hm(g.to)}, ${fmt(g.secs)}: ${g.label}` });
      attachTip(seg, () => tipNode(`${clock(g.from)} → ${clock(g.to)}`, [{ color: sev(g) === 'bad' ? 'var(--critical)' : 'var(--warning)', value: fmt(g.secs), label: g.label }]));
      cov.append(seg);
    });
    const ticks = h('div', { class: 'covticks' });
    for (let i = 0; i <= 4; i++) ticks.append(h('span', { style: `left:${i * 25}%` }, hm(new Date(t0 + (total * i) / 4).toISOString())));
    card.append(h('div', { class: 'legend' },
      h('span', null, h('i', { style: 'background:var(--s1)' }), 'Logged'),
      h('span', null, h('i', { style: 'background:var(--warning)' }), 'Gap, explained'),
      h('span', null, h('i', { style: 'background:var(--critical)' }), 'Gap, unexpected')), cov, ticks);
    if (hl.gaps.length) {
      const limit = st.expand.gaps ? hl.gaps.length : 8;
      card.append(h('div', { class: 'tablewrap', style: 'max-height:none' }, h('table', null,
        h('thead', null, h('tr', null, h('th', null, 'Status'), h('th', null, 'From → to'), h('th', { class: 'n' }, 'Length'), h('th', null, 'Cause'))),
        h('tbody', null, hl.gaps.slice(0, limit).map((g) => h('tr', null,
          h('td', null, h('span', { class: 'sev ' + sev(g) }, sev(g) === 'bad' ? '▲ Unexpected' : '◆ Explained')),
          h('td', null, `${clock(g.from)} → ${clock(g.to)}`), h('td', { class: 'n' }, fmt(g.secs)), h('td', null, g.label)))))));
      if (hl.gaps.length > 8) card.append(h('button', { class: 'link morebtn', on: { click() { st.expand.gaps = !st.expand.gaps; render(); } } }, st.expand.gaps ? 'Show fewer' : `Show all ${hl.gaps.length} gaps`));
    } else {
      card.append(h('p', { class: 'note' }, '✓ No gaps over 1 min.'));
    }
    if (hl.tail) card.append(h('p', { class: 'note' }, hl.tail));
  }
  if (hl.details) card.append(h('details', null, h('summary', null, 'Logger on/off periods, incognito and browser sessions'), h('pre', null, hl.details)));
  return card;
}

// ---------- page ----------
function render() {
  const res = st.res;
  const out = [trendCard()];
  if (res) {
    const d = res.data;
    if (!d.events) {
      out.push(h('section', { class: 'card' }, h('h2', null, 'No log for this day'), h('p', { class: 'sub' }, `Nothing was logged on ${st.day}.`)));
    } else {
      out.push(tiles(d), h('div', { class: 'grid2' }, hourlyCard(d), sitesCard(d)), appsCard(d), youtubeCard(d), discordCard(d), searchesCard(d), healthCard(res.health));
    }
  }
  app.replaceChildren(...out.filter(Boolean));
  renderNav();
}

function renderNav() {
  const d = st.day, days = st.days;
  const prev = days.filter((x) => x < d).pop(), next = days.find((x) => x > d);
  $('#prev').disabled = !prev; $('#next').disabled = !next;
  $('#prev').title = prev ? `Previous log: ${prev}` : 'No earlier logs';
  $('#next').title = next ? `Next log: ${next}` : 'No later logs';
  $('#date').value = d; $('#date').max = todayStr(); if (days.length) $('#date').min = days[0];
  $('#daylabel').textContent = toLocalDate(d).toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  const i = days.indexOf(d);
  $('#pos').textContent = i >= 0 ? `${i + 1} of ${days.length} logged days` : 'no log';
  $('#today').disabled = d === todayStr();
  $('#latest').disabled = !days.length || d === days[days.length - 1];
  const p = $('#integrity'), ig = st.integrity;
  if (ig) {
    const cls = !ig.ok && ig.errors.length ? 'bad' : (ig.ok ? 'ok' : 'warn');
    p.className = 'pill ' + cls;
    p.querySelector('.g').textContent = cls === 'ok' ? '✓' : (cls === 'bad' ? '✕' : '▲');
    p.querySelector('.t').textContent = cls === 'ok' ? 'Log intact' : (cls === 'bad' ? 'Tampering detected' : 'Log check: warnings');
    p.title = ig.status + ' (click to re-check)';
  }
}

async function load(day, { quiet = false } = {}) {
  const seq = ++st.seq;
  if (!quiet) app.classList.add('loading');
  try {
    const res = await api('/api/day/' + day);
    if (seq !== st.seq) return;
    st.res = res; st.day = day;
    render();
  } catch (e) {
    if (seq !== st.seq) return;
    app.replaceChildren(h('section', { class: 'card err' }, h('h2', null, 'Could not load ' + day), h('p', { class: 'sub' }, String(e.message || e) + ' — is tools/serve.py still running?')));
    st.day = day; renderNav();
  } finally {
    if (seq === st.seq) app.classList.remove('loading');
  }
}

function go(day) {
  if (!day) return;
  if (location.hash.slice(1) !== day) history.replaceState(null, '', '#' + day);
  load(day);
}

async function init() {
  try {
    const j = await api('/api/days');
    st.days = j.days; st.trend = j.trend; st.integrity = j.integrity; st.logDir = j.log_dir;
  } catch (e) {
    app.replaceChildren(h('section', { class: 'card err' }, h('h2', null, 'Could not reach the server'), h('p', { class: 'sub' }, String(e.message || e))));
    return;
  }
  const want = location.hash.slice(1);
  const start = /^\d{4}-\d{2}-\d{2}$/.test(want) ? want : (st.days[st.days.length - 1] || todayStr());
  st.day = start;
  if (!st.days.length) {
    app.replaceChildren(h('section', { class: 'card' }, h('h2', null, 'No logs yet'), h('p', { class: 'sub' }, `Nothing found in ${st.logDir}.`)));
    renderNav();
    return;
  }
  go(start);
}

async function reload() {  // refresh the day list + current day without losing the view
  try {
    const j = await api('/api/days');
    st.days = j.days; st.trend = j.trend; st.integrity = j.integrity;
  } catch (e) { /* load() below reports it */ }
  load(st.day, { quiet: true });
}

// ---------- controls ----------
const step = (dir) => {
  const d = st.day;
  go(dir < 0 ? st.days.filter((x) => x < d).pop() : st.days.find((x) => x > d));
};
$('#prev').addEventListener('click', () => step(-1));
$('#next').addEventListener('click', () => step(1));
$('#today').addEventListener('click', () => go(todayStr()));
$('#latest').addEventListener('click', () => go(st.days[st.days.length - 1]));
$('#refresh').addEventListener('click', reload);
$('#date').addEventListener('change', (e) => go(e.target.value));
$('#integrity').addEventListener('click', async () => {
  $('#integrity').querySelector('.t').textContent = 'Checking…';
  try { st.integrity = await api('/api/integrity?refresh=1'); } catch (e) { /* keep old */ }
  render();
});
window.addEventListener('hashchange', () => { const d = location.hash.slice(1); if (/^\d{4}-\d{2}-\d{2}$/.test(d) && d !== st.day) load(d); });
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
});
setInterval(() => { if (!document.hidden && st.day === todayStr()) reload(); }, 60000);

// theme: auto -> light -> dark (a per-viewer convenience; works without storage)
const THEMES = ['auto', 'light', 'dark'];
let theme = 'auto';
try { theme = THEMES.includes(localStorage.getItem('summary-theme')) ? localStorage.getItem('summary-theme') : 'auto'; } catch (e) {}
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = theme;
  $('#theme').textContent = theme[0].toUpperCase() + theme.slice(1);
  $('#theme').title = 'Theme: ' + theme + ' (click to change)';
  if (st.day && st.res) render();  // charts read colors from CSS variables
}
$('#theme').addEventListener('click', () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % 3];
  try { localStorage.setItem('summary-theme', theme); } catch (e) {}
  applyTheme();
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (theme === 'auto' && st.res) render(); });
applyTheme();
init();
</script>
</body>
</html>
